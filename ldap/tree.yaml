# Declarative OpenLDAP tree, rendered into ldap/.generated/bootstrap.ldif by
# scripts/render_ldap_bootstrap.py (run via `make render`, part of `make up`).
#
# - Each name in organizational_units becomes `ou=<name>,$LDAP_BASE_DN`.
# - This lab deliberately seeds no users here. The whole point of the lab is
#   that the LCM Joiner workflow is what creates user entries (under
#   Employees, see below) from the mock HRIS — a pre-seeded user would just
#   be test fixture data pretending to be something LCM already provisioned.
#   `users` is still supported by the renderer/schema below if you want to
#   seed out-of-band accounts for your own experiments, but this lab doesn't
#   use it: each user becomes an inetOrgPerson + accountStatus entry under
#   its `ou`; `mail` defaults to "<uid>@$LDAP_DOMAIN" unless given explicitly;
#   `is_active` defaults to true unless set to false.
# - Do NOT add a cn=admin entry here — osixia/openldap creates it from
#   LDAP_ADMIN_PASSWORD automatically, and a duplicate aborts the bootstrap
#   import on first start.
# - `groups` seeds LDAP groups for Veza's LDAP integration to discover (Groups
#   Object Class groupOfUniqueNames, the integration's default) so they're
#   available as entitlements when building Access Profiles. Unlike `users`,
#   these ARE meant to be pre-seeded here — an Access Profile needs an existing
#   group to grant membership to, so the group has to exist and be synced into
#   Veza before the profile can reference it. Each group lands under the
#   `Groups` OU. groupOfUniqueNames requires at least one uniqueMember by LDAP
#   schema, so each group is seeded with itself as a placeholder member
#   (harmless, and clearly not a real employee) until LCM/Access Profiles add
#   real ones.
# - After editing this file, run `make reset` (not just `make render`): osixia
#   only applies bootstrap LDIF/schema on an empty database.

organizational_units:
  - IT          # example OU, otherwise unused — customize freely for your own org structure
  - Marketing   # example OU, otherwise unused — customize freely for your own org structure
  - Employees   # LCM provisioning target: every HRIS-synced user lands here, regardless
                # of department (see hris/README.md's "Setting up the LCM policy" section)
  - Groups      # holds the LDAP groups below, synced into Veza as Access Profile targets

groups:
  - cn: Engineering
    description: Engineering team access
  - cn: Finance
    description: Finance team access
  - cn: VPN-Users
    description: Remote VPN access
